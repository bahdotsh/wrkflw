# Tests run real jobs, and jobs keep their workspace under the user's cache
# directory by default. Tests must neither leave workspaces there nor see
# each other's, so every job they run, in process or through the built
# binary, starts in an empty one. An existing WRKFLW_FRESH_WORKSPACE wins,
# so `WRKFLW_FRESH_WORKSPACE=0 cargo run -- run ...` keeps workspaces.
[env]
WRKFLW_FRESH_WORKSPACE = "1"
# Likewise for the memory each job was measured to use: tests keep none, so
# they never change how a real run on this machine schedules its jobs. This
# applies to `cargo run` too, which then schedules every job as unmeasured.
# An existing value wins, so name a file to measure, as in
# `WRKFLW_JOB_MEMORY_FILE=/tmp/job-memory.json cargo run -- run ...`.
WRKFLW_JOB_MEMORY_FILE = ""
# And for the runner base image: a test run on a commit whose base isn't
# published would remember it as unavailable in the user's cache, and real
# runs would then skip it for a day. CI names its own base with
# WRKFLW_RUNNER_IMAGE and sets this to 1. It applies to `cargo run` too:
# set WRKFLW_PREBUILT_IMAGES=1 there to time a first run on the base.
WRKFLW_PREBUILT_IMAGES = "0"
