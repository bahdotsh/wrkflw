name: Continue On Error Test

on: [push]

jobs:
  test-continue:
    runs-on: ubuntu-latest
    steps:
      - name: Failing step with continue
        run: exit 1
        continue-on-error: true

      - name: Should still run
        run: echo "I ran after failure"

  test-if-skip:
    runs-on: ubuntu-latest
    steps:
      - name: Always runs
        run: echo "hello"

      - name: Skipped step
        if: "false"
        run: echo "should not run"

      - name: Runs after skip
        run: echo "after skip"
